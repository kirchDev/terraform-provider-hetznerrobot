# pnpm settings. Moved here from .npmrc: pnpm 10+ reads only auth/registry
# settings from .npmrc — every other setting must live in this file.

# Automatically install missing peer dependencies when possible.
autoInstallPeers: true

# Require packages to be at least 4320 minutes (3 days) old before install.
minimumReleaseAge: 4320

# Prefer using the lockfile as-is for deterministic installs.
preferFrozenLockfile: true

# Verify package integrity in the store before linking.
verifyStoreIntegrity: true

# Do not fail installs on peer dependency conflicts.
strictPeerDependencies: false

# Use pnpm's isolated node_modules linker layout.
nodeLinker: isolated

# Package-manager enforcement is deliberately left unset. pnpm 10's
# packageManagerStrict / packageManagerStrictVersion were replaced in pnpm 11 by
# pmOnFail (download | error | warn | ignore), whose default is `download`.
# Enforcement stays on under that default — pnpm errors out for a foreign package
# manager (shouldError covers `download` as well as `error`) — and `download`
# additionally fetches the pnpm version pinned in package.json's packageManager
# field, which is the closest match to the old packageManagerStrict: true plus
# packageManagerStrictVersion: false. Setting pmOnFail here would only weaken that.
