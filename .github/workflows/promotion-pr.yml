# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# Opens and updates the rolling draft promotion PR. The body picks its target by
# asking whether a `stage` branch exists, so this file is identical whether the
# repo runs `dev → main` or `dev → stage → main`.
name: Promotion PR

on:
  push:
    branches:
      - dev
      - stage

permissions:
  contents: read
  pull-requests: write

jobs:
  promotion-pr:
    name: Promotion PR
    uses: kirchDev/workflows/.github/workflows/_promotion-pr.yml@4767c07534dcf886d6a387f29dc70a097b44c591 # v0.14.0
