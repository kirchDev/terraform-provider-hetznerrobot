# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# `go` is in here deliberately — the provider handles account-wide Robot webservice credentials,
# so it is worth scanning. The body switches Go to autobuild on its own.
name: CodeQL

on:
  # PUSH ON THE RELEASE BRANCH ONLY. A push to an integration branch always has
  # a pull request open on it, and that PR run scans the same tree — listing
  # `dev` here as well ran the analysis twice for one result.
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]
    # `ready_for_review` is required once `dev` leaves the push trigger: a pull
    # request opened as a draft analyses once, and without this type undrafting
    # starts nothing — leaving a required code-scanning result that never comes.
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '34 23 * * 0'
  workflow_dispatch:

jobs:
  codeql:
    name: CodeQL
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    uses: kirchDev/workflows/.github/workflows/_codeql.yml@17381dcb03641c3e720449c345afeefa1365a329 # v0.17.0
    with:
      languages: '["actions", "go", "javascript-typescript"]'
