# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# Lands a queue branch by fast-forward once a human has approved its PR. The
# triggers stay here because a reusable workflow cannot be dispatched — the
# approval gate therefore remains in the repo it protects (ADR-0008 in
# kirchDev/infrastructure).
name: Fast-forward Queue

on:
  push:
    branches:
      - 'ai/queue-**'
  # An approval arrived. This is the ONE automatic landing trigger, and it fires
  # only from the DEFAULT branch's copy of this file.
  #
  # THE APPROVAL MUST COME LAST — an approval counts only while its commit is
  # still the head, so any push after it un-approves the PR, and nothing fires
  # when CI goes green on an already-approved one. Approve after CI is green, or
  # land it with `workflow_dispatch`.
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr:
        description: 'Queue PR number to land; empty considers every open queue PR'
        required: false
        type: string

jobs:
  fast-forward-queue:
    name: Fast-forward Queue
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
    uses: kirchDev/workflows/.github/workflows/_fast-forward-queue.yml@94cbcbd676b989ac6c6327055a240132f5cd76a5 # v0.8.0
    with:
      pr: ${{ inputs.pr }}
    secrets:
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
